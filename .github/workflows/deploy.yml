name: Deploy Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VM e atualizar o bot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/comunidade-bot
            git pull origin main
            /home/ubuntu/comunidade-bot/venv/bin/pip install -r requirements.txt
            sudo systemctl restart comunidade-bot
